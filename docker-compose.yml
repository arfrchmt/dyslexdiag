services:
  postgres:
    image: postgres:17
    container_name: dyslexicdiag-postgres
    environment:
      POSTGRES_DB: dyslexicdiag
      POSTGRES_USER: dyslexicdiag
      POSTGRES_PASSWORD: dyslexicdiag
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mysql:
    image: mysql:9
    container_name: dyslexicdiag-mysql
    environment:
      MYSQL_DATABASE: dyslexicdiag
      MYSQL_USER: dyslexicdiag
      MYSQL_PASSWORD: dyslexicdiag
      MYSQL_ROOT_PASSWORD: dyslexicdiag_root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    profiles:
      - mysql

volumes:
  postgres-data:
  mysql-data:
